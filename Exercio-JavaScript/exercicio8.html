<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 8 - Galeria com Destaque</title>
  <style>
    .galeria {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .card {
      width: 210px;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
    }

    .card.selecionado {
      border-color: #2563eb;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.5);
    }
  </style>
</head>
<body>
  <h1>Galeria com Destaque</h1>
  <div class="galeria">
    <div class="card">
      <img src="https://picsum.photos/id/1015/400/250" alt="Paisagem de montanhas">
      <h2>Montanhas</h2>
      <p>Paisagem com montanhas e natureza.</p>
    </div>
    <div class="card">
      <img src="https://picsum.photos/id/1011/400/250" alt="Paisagem de rio">
      <h2>Rio</h2>
      <p>Um rio cercado por vegetação.</p>
    </div>
    <div class="card">
      <img src="https://picsum.photos/id/1016/400/250" alt="Paisagem de floresta">
      <h2>Floresta</h2>
      <p>Árvores em uma área natural.</p>
    </div>
    <div class="card">
      <img src="https://picsum.photos/id/1020/400/250" alt="Paisagem de praia">
      <h2>Praia</h2>
      <p>Uma paisagem tranquila à beira-mar.</p>
    </div>
  </div>

  <script src="exercicio8.js"></script>
</body>
</html>
