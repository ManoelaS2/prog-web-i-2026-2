<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 6 - Semáforo Interativo</title>
  <style>
    .semaforo {
      width: 90px;
      padding: 12px;
      border-radius: 15px;
      background: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .luz {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      opacity: 0.3;
    }

    .vermelho { background: red; }
    .amarelo { background: yellow; }
    .verde { background: limegreen; }
    .acesa { opacity: 1; }
  </style>
</head>
<body>
  <h1>Semáforo Interativo</h1>
  <div class="semaforo">
    <div class="luz vermelho acesa"></div>
    <div class="luz amarelo"></div>
    <div class="luz verde"></div>
  </div>
  <button id="proximo">Próximo</button>

  <script src="exercicio6.js"></script>
</body>
</html>
