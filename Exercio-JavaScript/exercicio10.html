<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 10 - Validador de Formulário</title>
  <style>
    form {
      max-width: 350px;
    }

    label {
      display: block;
      margin-top: 12px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 7px;
    }

    input.erro {
      border: 2px solid red;
    }

    .mensagem-erro {
      color: red;
      font-size: 0.9em;
      margin: 4px 0;
    }

    #sucesso {
      color: green;
    }
  </style>
</head>
<body>
  <h1>Validador de Formulário</h1>
  <form id="formulario">
    <label for="nome">Nome:</label>
    <input type="text" id="nome">
    <p class="mensagem-erro" id="erroNome"></p>

    <label for="email">E-mail:</label>
    <input type="text" id="email">
    <p class="mensagem-erro" id="erroEmail"></p>

    <label for="idade">Idade:</label>
    <input type="number" id="idade">
    <p class="mensagem-erro" id="erroIdade"></p>

    <button type="submit">Enviar</button>
  </form>
  <p id="sucesso"></p>

  <script src="exercicio10.js"></script>
</body>
</html>
